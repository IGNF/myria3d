# @package _global_
# DALES linear probing -- grid phase: sweep the 12-value LR grid (configs/model/grid_probe/
# probe_lrs/lr_grid_12.yaml) on a frozen Flair3D+ backbone, pick a winner by val mIoU
# (dataset_description.select_metric). See readme_linear_probing.md.

defaults:
  - override /datamodule: downstream/dales_datamodule.yaml
  - override /dataset_description: dales.yaml
  - override /model: grid_probe/default.yaml
  - override /callbacks: grid_probe_grid.yaml
  - override /logger: wandb.yaml

logger:
  wandb:
    name: "GridProbe | DALES | grid phase"

trainer:
  accelerator: gpu
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 50

datamodule:
  batch_size: 12
  num_workers: 4
