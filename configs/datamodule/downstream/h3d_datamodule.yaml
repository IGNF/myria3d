_target_: myria3d.pctl.datamodule.downstream.DownstreamNpyDatamodule

data_root: ${oc.env:DOWNSTREAM_DATA_ROOT,/data/geist/Pointcept/data}/h3d
dataset_target: myria3d.pctl.dataset.downstream.h3d.H3dDataset

train_dir: train
val_dir: val
test_dir: test

# preprocess_h3d.py's own argparse default is `--chunk-size inf` (one folder per
# source file), but its docstring's documented Usage example runs it with
# `--chunk-size 100` -- confirmed as the value actually used for the on-disk H3D
# scenes here. Same convention as ECLAIR: SubtileCrop performs a real 2x2 quadrant
# crop down to the 50m receptive field the Flair3D+ backbone was pretrained on.
tile_width: 100
subtile_width: 50

pre_filter:
  _target_: functools.partial
  _args_:
    - "${get_method:myria3d.pctl.dataset.utils.pre_filter_below_n_points}"
  min_num_nodes: 1

batch_size: 12
num_workers: 4
prefetch_factor: 2

defaults:
  - transforms: downstream.yaml
