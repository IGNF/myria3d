  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    if: ((github.ref_name == 'main') && (github.event_name == 'push'))
    environment:
      name: pypi
      url: https://pypi.org/p/myria3d/
    permissions:
      contents: read
      packages: write
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      # See https://github.com/marketplace/actions/setup-micromamba
      - name: setup-micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          environment-name: myria3d # activate the environment
          cache-environment: true
          cache-downloads: true
          generate-run-shell: true

      - name: Run tests with pytest
        shell: micromamba-shell {0}
        run: python -m pytest ./tests -rA -v

      - name: Clean up before building package
        run: rm -rf tmp myria3d.egg-info dist

      - name: Build pip package
        shell: micromamba-shell {0}
        run: python -m build

      - name: pypi-publish
        uses: pypa/gh-action-pypi-publish@v1.14
        with:
          skip-existing: true
