name: CICD

on:
  # Run CICD for non-draft pull request
  pull_request:
    branches:
      - main
  # Also run when the pull request merges  (which generates a push)
  # So that we can tag the docker image appropriately.
  push:
    branches:
      - main
      - staging-*
      - fix/no-self-hosted

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io
  TEST_TAG: ${{ github.repository }}:test

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      # See https://github.com/marketplace/actions/setup-micromamba
      - name: Setup micromamba environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          environment-name: myria3d
          cache-environment: true
          cache-downloads: true
          generate-run-shell: true

      - name: Run tests with pytest
        shell: micromamba-shell {0}
        run: python -m pytest -rA -v -m "not functional"

      - name: Example inferences run via Docker (pytest functional tests)
        shell: micromamba-shell {0}
        run: python -m pytest -rA -v -m "functional" --no-cov

  test-deploy-docker:
    needs: test
    # if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Build the Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Run pytest unit tests in docker image
        run: >
          docker run
          --ipc=host
          ${{ env.TEST_TAG }}
          python -m
          pytest -rA -v -m "not functional"

      # IMPORTANT: Always run images with --ipc=host and --shm-size=2gb (at least) to enable
      # sufficient shared memory when predicting on large files.
      - name: Example inferences run via Docker (pytest functional tests) in docker image
        run: >
          docker run
          --ipc=host
          --shm-size=2gb
          -v ${{ github.workspace }}/test_outputs:/outputs
          ${{ env.TEST_TAG }}
          python -m
          pytest -rA -v -m "functional" --no-cov

      # get version number and date, to tag the image pushed to a private docker registry
      - name: Get version number
        id: tag
        run: |
          echo "VERSION=$(docker run myria3d python -m myria3d._version)" >> $GITHUB_ENV
          echo "DATE=$(date '+%Y.%m.%d')" >> $GITHUB_ENV

      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build an Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  #     - name: Upload functional test outputs as release assets
